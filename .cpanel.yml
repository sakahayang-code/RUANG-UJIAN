---
# Konfigurasi Auto Deploy melalui fitur "cPanel Git™ Version Control"
# Jika Anda mengkloning repositori ini langsung dari cPanel Rumahweb:
deployment:
  tasks:
    # Ubah 'username' sesuai username cPanel Anda dan sesuaikan target direktori tujuan
    - export DEPLOYPATH=/home/$(whoami)/public_html/
    # Sinkronisasi berkas aplikasi dengan mengecualikan berkas git, tests, database produksi, dan direktori uploads
    - /bin/rsync -av --delete --exclude='.git*' --exclude='.github' --exclude='tests' --exclude='database/storage/*.sqlite*' --exclude='storage/uploads/*' --exclude='storage/backups/*' ./ $DEPLOYPATH
