<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Subtle decorative circles -->
  <circle cx="256" cy="230" r="140" fill="url(#accentGrad)" opacity="0.12" />

  <!-- Exam Document / Clipboard Badge -->
  <rect x="136" y="116" width="240" height="280" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  
  <!-- Clip at top -->
  <rect x="206" y="96" width="100" height="36" rx="12" fill="#38bdf8" />
  
  <!-- "RU" Monogram -->
  <g fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-weight="900" font-size="124" letter-spacing="-2">
    <text x="165" y="275">R</text>
    <text x="255" y="275">U</text>
  </g>
  
  <!-- Exam Lines / Progress Indicator -->
  <rect x="176" y="315" width="160" height="8" rx="4" fill="#94a3b8" opacity="0.6" />
  <rect x="176" y="335" width="110" height="8" rx="4" fill="#38bdf8" />

  <!-- Gold Checkmark Badge -->
  <circle cx="360" cy="370" r="44" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M344 370 L355 381 L378 358" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
