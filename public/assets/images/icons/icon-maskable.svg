<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Multi-stop Gradient (Full-bleed, Opaque) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Radiant Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Academic Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Gold Seal & Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Pencil Body Gradient -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Full-Bleed 100% Opaque Background (Zero transparency for Android Adaptive / Maskable Icon) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="140" fill="url(#accentGlow)" opacity="0.25" filter="blur(30px)" />
  <circle cx="400" cy="400" r="130" fill="#38bdf8" opacity="0.20" filter="blur(30px)" />

  <!-- 2. Centered Logo Artwork Group (Scaled to 88% to sit comfortably within Android 80% Safe Zone) -->
  <g id="safeZoneArtwork" transform="translate(256 256) scale(0.88) translate(-256 -256)">
    <!-- Architectural Room Framing / Arch Portal ("Ruang") -->
    <path d="M120 420 L120 190 Q120 140 170 140 L342 140 Q392 140 392 190 L392 420" 
          fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="8" stroke-dasharray="12 12" />

    <!-- Examination Paper / Document Sheet with Folded Corner -->
    <g filter="url(#docShadow)">
      <!-- Base Paper -->
      <rect x="146" y="152" width="220" height="276" rx="22" fill="#ffffff" />
      
      <!-- Header Banner on Paper -->
      <path d="M146 174 Q146 152 168 152 L324 152 Q346 152 346 174 L346 205 L146 205 Z" fill="url(#accentGlow)" />
      
      <!-- Paper Header Dots / Controls -->
      <circle cx="176" cy="178" r="6" fill="#ffffff" opacity="0.9" />
      <circle cx="196" cy="178" r="6" fill="#ffffff" opacity="0.6" />
      <circle cx="216" cy="178" r="6" fill="#ffffff" opacity="0.4" />

      <!-- Exam Checklist Items (Administration Rows) -->
      <!-- Item 1: Emerald Verified -->
      <circle cx="182" cy="236" r="10" fill="#ecfdf5" stroke="#10b981" stroke-width="3" />
      <path d="M178 236 L181 239 L187 233" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="204" y="231" width="124" height="10" rx="5" fill="#4f46e5" opacity="0.85" />

      <!-- Item 2: Cyan Checked -->
      <circle cx="182" cy="272" r="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="3" />
      <path d="M178 272 L181 275 L187 269" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="204" y="267" width="102" height="10" rx="5" fill="#64748b" opacity="0.6" />

      <!-- Item 3: Purple Checked -->
      <circle cx="182" cy="308" r="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="3" />
      <path d="M178 308 L181 311 L187 305" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="204" y="303" width="116" height="10" rx="5" fill="#64748b" opacity="0.6" />

      <!-- Item 4: Amber Progress -->
      <circle cx="182" cy="344" r="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="3" />
      <path d="M178 344 L181 347 L187 341" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="204" y="339" width="86" height="10" rx="5" fill="#94a3b8" opacity="0.5" />
      
      <!-- School Monogram Seal Stamp -->
      <text x="256" y="398" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#6366f1" opacity="0.75">RUANG UJIAN</text>
    </g>

    <!-- Academic Mortarboard (Toga Ujian) - Floating Top Crest -->
    <g filter="url(#docShadow)">
      <!-- Cap Diamond Plane -->
      <polygon points="256,76 384,124 256,172 128,124" fill="url(#capGrad)" stroke="#4f46e5" stroke-width="4" stroke-linejoin="round" />
      
      <!-- Cap Skull Base -->
      <path d="M188 150 L188 184 Q256 214 324 184 L324 150" fill="#4338ca" stroke="#312e81" stroke-width="3" />
      
      <!-- Mortarboard Button at Center -->
      <ellipse cx="256" cy="124" rx="10" ry="7" fill="url(#goldGrad)" />
      
      <!-- Golden Graduation Tassel -->
      <path d="M256 124 Q290 130 334 160 Q346 174 344 195" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
      <polygon points="340,192 348,192 352,216 336,216" fill="url(#goldGrad)" />
      <circle cx="344" cy="194" r="5" fill="#f59e0b" />
    </g>

    <!-- Official Verified Gold Seal Badge (Bottom Right) -->
    <g filter="url(#badgeShadow)">
      <circle cx="366" cy="378" r="42" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
      <circle cx="366" cy="378" r="34" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
      <!-- White Checkmark Inside Seal -->
      <path d="M351 378 L362 389 L383 367" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Examination Pen / Stylus Drafting (Floating Sleek Accents) -->
    <g transform="rotate(-35 340 280)">
      <!-- Pen Barrel -->
      <rect x="360" y="240" width="22" height="96" rx="6" fill="url(#pencilGrad)" stroke="#ffffff" stroke-width="2.5" />
      <!-- Pen Grip & Band -->
      <rect x="360" y="316" width="22" height="12" fill="url(#goldGrad)" />
      <!-- Pen Nib Tip -->
      <polygon points="360,336 382,336 371,360" fill="#ffffff" />
      <polygon points="367,352 375,352 371,360" fill="#1e293b" />
    </g>
  </g>
</svg>
