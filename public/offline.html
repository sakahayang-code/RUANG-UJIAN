<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sedang Offline - RUANG UJIAN</title>
    <meta name="theme-color" content="#1e3a8a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 36px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-retry {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 9999px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }
        .btn-retry:active {
            transform: scale(0.96);
            background: #1d4ed8;
        }
        .app-name {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">📡</div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang tidak terhubung ke jaringan internet. Pastikan Wi-Fi atau data seluler Anda aktif lalu coba kembali.</p>
        <button class="btn-retry" onclick="window.location.reload()">Muat Ulang Halaman</button>
        <div class="app-name">RUANG UJIAN • PWA Android</div>
    </div>
</body>
</html>
