<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e60ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2540;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="180" r="160" fill="url(#accentGrad)" opacity="0.15"/>
  
  <!-- Graduation Cap & Exam Board Motif -->
  <!-- Mortarboard Diamond -->
  <polygon points="256,120 410,190 256,260 102,190" fill="#ffffff" />
  
  <!-- Cap Underband -->
  <path d="M150,225 L150,285 C150,335 362,335 362,285 L362,225 L256,275 Z" fill="#e2e8f0" />
  
  <!-- Tassel Ribbon & Button -->
  <circle cx="256" cy="190" r="10" fill="#38bdf8" />
  <path d="M256,190 Q390,210 395,290" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <rect x="388" y="290" width="14" height="30" rx="4" fill="#38bdf8" />
  
  <!-- Exam Paper Sheet with Checkmark Badge -->
  <rect x="146" y="320" width="220" height="110" rx="18" fill="#ffffff" opacity="0.95" />
  <rect x="176" y="348" width="100" height="12" rx="6" fill="#94a3b8" />
  <rect x="176" y="372" width="130" height="12" rx="6" fill="#cbd5e1" />
  <rect x="176" y="396" width="70" height="12" rx="6" fill="#e2e8f0" />
  
  <!-- Green Check Badge -->
  <circle cx="330" cy="375" r="24" fill="#10b981" />
  <polyline points="320,375 327,382 342,367" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
